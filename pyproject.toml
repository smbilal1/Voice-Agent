[project]
name = "carecloud-voice-patient-registration"
version = "0.1.0"
description = "Voice AI patient registration assessment backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic==1.16.5",
  "fastapi==0.116.1",
  "Jinja2==3.1.6",
  "pydantic-settings==2.10.1",
  "psycopg[binary]==3.2.10",
  "SQLAlchemy==2.0.43",
  "uvicorn[standard]==0.35.0",
]

[tool.vercel]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
